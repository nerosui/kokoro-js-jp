name: Deploy demo to GitHub Pages

# The demo is now 100% CDN-driven: demo/main.js imports the published
# dist/kokoro-jp.web.js from jsDelivr and lets DEFAULT_JAPANESE_ASSETS_URL pull the
# dictionary/worker/WASM from the same versioned directory. So there is nothing to
# build or copy here — the site is three static files.
#
# Consequence: the deployed demo tracks the *published* version, not main. A change
# under src/ only reaches the demo once that version is on npm, which is why this
# workflow also runs on `release: published` (and no longer on src/ pushes).
on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/deploy-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp demo/index.html demo/style.css demo/main.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
